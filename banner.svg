<svg fill="none" viewBox="0 0 600 200" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@500;700&amp;display=swap');

      .bg {
        fill: #ffffff;
      }
      .japanese-text {
        font-family: 'Kaisei Tokumin', serif;
        font-weight: 700;
        font-size: 56px;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- Белый фон -->
  <rect class="bg" width="100%" height="100%"/>

  <!-- Надпись на хирагане -->
  <text x="50%" y="50%" class="japanese-text">はじめまして</text>
</svg>
